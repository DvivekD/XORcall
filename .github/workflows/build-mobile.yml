name: Build Mobile Clients (Android APK & iOS)

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Download & Bundle Offline Vosk Model into APK Assets
        run: |
          mkdir -p android/app/src/main/assets
          echo "Downloading Vosk model zip directly into assets..."
          curl -sSL https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip -o android/app/src/main/assets/model-en.zip
          ls -lh android/app/src/main/assets/model-en.zip

      - name: Build Android Debug APK
        run: |
          cd android
          gradle wrapper --gradle-version 8.10.2
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Copy & Rename APK
        run: |
            mkdir -p build-artifacts
            cp android/app/build/outputs/apk/debug/app-debug.apk build-artifacts/XORcall-v1.2.0-debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: XORcall-Android-APK
          path: build-artifacts/XORcall-v1.2.0-debug.apk

      - name: Publish Direct Release APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.0-apk
          name: "XORcall v1.2.0 Android APK (Auto-Speakerphone Intercept + Groq Whisper STT + AI Voice Clone Radar)"
          body: |
            ### XORcall Autonomous In-Call Cyber Safety Guardian v1.2.0
            - **Auto-Speakerphone In-Call Capture**: Automatically engages loudspeaker upon `OFFHOOK` and binds raw `MIC` stream with +20dB digital AGC amplification, allowing the phone to capture both the remote caller's audio and the user's speech without being stripped by Android hardware echo cancellation.
            - **Dual Hybrid Speech Pipeline (Groq Whisper Turbo + Vosk Offline)**: Integrates Groq LPU Whisper Turbo (`whisper-large-v3-turbo`) for sub-200ms cloud transcription with superior Indian English and vernacular accuracy, while retaining bundled on-device Vosk Kaldi as instant offline fallback.
            - **Scientific AI Voice Clone Radar**: 512-point windowed Cooley-Tukey FFT spectral analysis, high-frequency vocoder cutoff ratio (>6.5 kHz), Wiener entropy spectral flatness, and Normalized Autocorrelation pitch micro-jitter tracking (0.5%-2.5% biological human vs <0.3% neural vocoder rigidity).
            - **Real-Time Live Forensic Dashboard**: Live acoustic radar displaying micro-jitter %, HF ratio, spectral entropy, and instant verdict (Human vs AI Clone).
          files: build-artifacts/XORcall-v1.2.0-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
