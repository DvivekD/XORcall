name: Build Mobile Clients (Android APK & iOS)

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Download & Bundle Offline Vosk Model into APK Assets
        run: |
          mkdir -p android/app/src/main/assets
          echo "Downloading Vosk model zip directly into assets..."
          curl -sSL https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip -o android/app/src/main/assets/model-en.zip
          ls -lh android/app/src/main/assets/model-en.zip

      - name: Build Android Debug APK
        run: |
          cd android
          gradle wrapper --gradle-version 8.10.2
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Copy & Rename APK
        run: |
            mkdir -p build-artifacts
            cp android/app/build/outputs/apk/debug/app-debug.apk build-artifacts/XORcall-v1.2.4-debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: XORcall-Android-APK
          path: build-artifacts/XORcall-v1.2.4-debug.apk

      - name: Publish Direct Release APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.4-apk
          name: "XORcall v1.2.4 Android APK (Armed Groq Whisper Turbo Cloud STT + Adaptive Soft-Knee AGC)"
          body: |
            ### XORcall Autonomous In-Call Cyber Safety Guardian v1.2.4
            - **Hardcoded Pre-Armed Groq Whisper Turbo**: Out-of-the-box sub-200ms cloud transcription powered by Groq LPU `whisper-large-v3-turbo` with Indian English & Hinglish accuracy. Zero setup needed.
            - **Domain Prompt Biasing**: Whisper Turbo decoder is biased towards exact Indian cyber extortion terminology (`5 lakhs`, `digital arrest`, `CBI`, `police custody`, `MDMA`, `RBI escrow`, `wire transfer`).
            - **Adaptive Soft-Knee Headroom AGC**: Replaced harsh clipping with dynamic peak-tracking automatic gain control, preserving pure speech formants on high-volume speakerphones.
            - **Comprehensive Phonetic Normalizer**: Auto-maps telephony acoustic distortions (*"police custom"* -> `police custody`, *"digital address"* -> `digital arrest`, *"five lock/block"* -> `5 lakh`).
            - **Permanent Keystore Signing**: Pre-signed with committed debug keystore for seamless updates.
          files: build-artifacts/XORcall-v1.2.4-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
