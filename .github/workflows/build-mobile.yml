name: Build Mobile Clients (Android APK & iOS)

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Build Android Debug APK
        run: |
          cd android
          gradle wrapper --gradle-version 8.10.2
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Copy & Rename APK
        run: |
          mkdir -p build-artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk build-artifacts/XORcall-v1.0.6-debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: XORcall-Android-APK
          path: build-artifacts/XORcall-v1.0.6-debug.apk

      - name: Publish Direct Release APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.6-apk
          name: "XORcall v1.0.6 Android APK (Always-On Live Speech Transcriber, Kidnap & 5 Lakhs Death Threat Interceptor)"
          body: |
            ### XORcall Autonomous Real-Time Cyber Safety Guardian v1.0.6
            - **Always-On Live Speech Transcriber**: Live speech recognition activates automatically as soon as the Shield is turned ON. Words appear live in the transcript box in real time.
            - **Expanded Kidnap & Death Threat Lexicon**: Explicit instant triggers for `"kill"`, `"killing"`, `"murder"`, `"son"`, `"daughter"`, `"hostage"`, `"kidnap"`, `"5 lakhs"`, and `"5 million dollar extraction"`.
            - **Immediate Sensory Alert Chain**: Fires Cheek Haptic Shockwave, High-Priority Heads-Up Warning Banner, In-Ear Audio Whisper (TTS), and Silent Guardian Ping on the very first detected threat phrase.
            - **1-Tap Roleplay Quick Button**: Added dedicated `Kidnap: 5L & Son` test button alongside `5M $ Extort`, Student, Senior, and Pro vectors.
            - **Vivo V25 Pro / Android 14 Verified Compatibility**.
          files: build-artifacts/XORcall-v1.0.6-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
