name: Build Mobile Clients (Android APK & iOS)

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Download & Bundle Offline Vosk Model into APK Assets
        run: |
          mkdir -p android/app/src/main/assets
          echo "Downloading Vosk model zip directly into assets..."
          curl -sSL https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip -o android/app/src/main/assets/model-en.zip
          ls -lh android/app/src/main/assets/model-en.zip

      - name: Build Android Debug APK
        run: |
          cd android
          gradle wrapper --gradle-version 8.10.2
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Copy & Rename APK
        run: |
          mkdir -p build-artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk build-artifacts/XORcall-v1.1.0-debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: XORcall-Android-APK
          path: build-artifacts/XORcall-v1.1.0-debug.apk

      - name: Publish Direct Release APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.0-apk
          name: "XORcall v1.1.0 Android APK (Direct Telephony Audio Interceptor + Phonetic Extortion Normalizer)"
          body: |
            ### XORcall Autonomous In-Call Cyber Safety Guardian v1.1.0
            - **Direct Telephony Audio Interception**: Ingests in-call audio directly from the device's voice communication mixer (`VOICE_CALL` / `VOICE_COMMUNICATION` / `VOICE_DOWNLINK`) upon `OFFHOOK`, without needing physical loudspeaker playback.
            - **Hardware Digital AGC Pre-Amplifier**: Amplifies quiet remote caller audio by +20dB with hyperbolic tangent (`tanh`) soft-limiter to prevent distortion while maximizing Vosk speech sensitivity.
            - **Phonetic Speech Normalizer**: Resolves Indian English extortion speech patterns transcribed by US English acoustic models (`"five lacks"`, `"five lock"`, `"50 lacks"` -> canonical `"5 lakh"`, `"kid nap"` -> `"kidnap"`, `"c b i"` -> `"cbi"`).
            - **Multi-Listener Thread-Safe STT Pipeline**: Prevents service and activity listener overwrites, with atomic model extraction verification.
            - **Real-Time Live Audio Energy Meter**: Displays real-time audio capture energy (RMS %) and selected audio source directly on the dashboard.
          files: build-artifacts/XORcall-v1.1.0-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
