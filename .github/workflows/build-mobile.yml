name: Build Mobile Clients (Android APK & iOS)

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Download & Bundle Offline Vosk Model into APK Assets
        run: |
          mkdir -p android/app/src/main/assets
          echo "Downloading Vosk model zip directly into assets..."
          curl -sSL https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip -o android/app/src/main/assets/model-en.zip
          ls -lh android/app/src/main/assets/model-en.zip

      - name: Build Android Debug APK
        run: |
          cd android
          gradle wrapper --gradle-version 8.10.2
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Copy & Rename APK
        run: |
            mkdir -p build-artifacts
            cp android/app/build/outputs/apk/debug/app-debug.apk build-artifacts/XORcall-v1.2.7-debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: XORcall-Android-APK
          path: build-artifacts/XORcall-v1.2.7-debug.apk

      - name: Publish Direct Release APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.7-apk
          name: "XORcall v1.2.7 Android APK (Regex Kill-Chain Conjunction + Octave-Pruned AI Voice Radar)"
          body: |
            ### XORcall Autonomous In-Call Cyber Safety Guardian v1.2.7
            - **Regex-Driven Kill-Chain Intent Engine**: Replaced rigid string lists with compiled regular expressions matching all currency amounts (lakhs, crores, rupees, numbers) and transfer verbs (transfer, deposit, wire, pay to RBI/escrow). Phrases like `"Inspector from CBI Cyber Cell... arrest warrant... transfer 3 lakhs to RBI account"` now trigger `CRITICAL` immediately.
            - **Conversational AI Voice Forensics with Octave Pruning**: Solved subharmonic octave jumps ($L \to 2L$) in autocorrelation using golden-standard fundamental frequency pruning. Combined 1024-sample window (64ms) Cauchy-Schwarz normalized autocorrelation, detrended Relative Average Perturbation (RAP < 0.32%), Wiener entropy, and harmonic periodicity lock. ChatGPT Voice Mode (GPT-4o) and ElevenLabs now reliably trigger `🚨 AI SYNTHETIC VOICE DETECTED`.
            - **In-Call Speakerphone VAD & Cloud STT**: Lowered VAD speech RMS threshold from 0.012 to 0.004 so speakerphone audio from call speakers is cleanly captured. Buffer overflow now dispatches speech rather than discarding it. Added User-Agent and comprehensive legal prompt biasing to Groq Whisper Turbo.
            - **Assistant Interception Fix**: Prioritized standard `MediaRecorder.AudioSource.MIC` over `VOICE_RECOGNITION` so hitting "Test Live Mic 6s" never triggers Google/Gemini Assistant or forces the app to background.
            - **Pre-signed with Permanent Debug Keystore**: Signed with v1 + v2 schemes for direct update/install over existing installations.
          files: build-artifacts/XORcall-v1.2.7-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
