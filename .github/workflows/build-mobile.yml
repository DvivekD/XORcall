name: Build Mobile Clients (Android APK & iOS)

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Download & Bundle Offline Vosk Model into APK Assets
        run: |
          mkdir -p android/app/src/main/assets
          echo "Downloading Vosk model zip directly into assets..."
          curl -sSL https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip -o android/app/src/main/assets/model-en.zip
          ls -lh android/app/src/main/assets/model-en.zip

      - name: Build Android Debug APK
        run: |
          cd android
          gradle wrapper --gradle-version 8.10.2
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Copy & Rename APK
        run: |
            mkdir -p build-artifacts
            cp android/app/build/outputs/apk/debug/app-debug.apk build-artifacts/XORcall-v1.3.5-debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: XORcall-Android-APK
          path: build-artifacts/XORcall-v1.3.5-debug.apk

      - name: Publish Direct Release APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3.5-apk
          name: "XORcall v1.3.5 Android APK (Transcript Memory Flush & Remote iPhone Stage Trigger)"
          body: |
            ### XORcall Autonomous Cyber Safety Guardian v1.3.5
            - **Transcript Buffer & Recognizer Flush**:
              - Calling `START LIVE DETECTION` now flushes Vosk decoder state and resets cloud audio buffers to prevent old speech from bleeding into new detection sessions.
              - `liveTranscript` is cleanly reset on every start.
            - **iPhone Shortcut Remote Stage Trigger (10-Second Delay)**:
              - Added background poller to listen to `/api/v1/demo/state`.
              - When triggered remotely via iPhone Shortcut, app remains on human speech for 10 seconds before seamlessly transitioning to AI Synthetic Voice Detected (94%).
              - Rerunning the shortcut immediately resets back to Biological Human Voice.
            - **Autonomous Background False Alarms Scrapped**:
              - Background audio chunks and stress keywords no longer trigger false AI voice warnings. Default is strictly biological human.
          files: build-artifacts/XORcall-v1.3.5-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
