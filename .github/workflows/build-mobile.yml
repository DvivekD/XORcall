name: Build Mobile Clients (Android APK & iOS)

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Download & Bundle Offline Vosk Model into APK Assets
        run: |
          mkdir -p android/app/src/main/assets
          echo "Downloading Vosk model zip directly into assets..."
          curl -sSL https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip -o android/app/src/main/assets/model-en.zip
          ls -lh android/app/src/main/assets/model-en.zip

      - name: Build Android Debug APK
        run: |
          cd android
          gradle wrapper --gradle-version 8.10.2
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Copy & Rename APK
        run: |
            mkdir -p build-artifacts
            cp android/app/build/outputs/apk/debug/app-debug.apk build-artifacts/XORcall-v1.2.9-debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: XORcall-Android-APK
          path: build-artifacts/XORcall-v1.2.9-debug.apk

      - name: Publish Direct Release APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.9-apk
          name: "XORcall v1.2.9 Android APK (Clean STT Decoupling, Dedicated AI Voice Radar Mode & Biological Formant Protection)"
          body: |
            ### XORcall Autonomous In-Call Cyber Safety Guardian v1.2.9
            - **Clean Speech Transcription Reversion & Decoupling**: Completely removed acoustic threat hijacking from raw audio chunk streaming. Vosk offline Kaldi and Groq Whisper Turbo transcribe continuous speech with zero interference, transcript overwrites, or false scam triggers.
            - **Dedicated AI Voice Radar Mode**: Isolated AI Synthetic Voice detection into an explicit, dedicated operating mode (`isAiVoiceDetectionArmed`). Normal call protection runs cleanly with zero acoustic noise.
            - **Biological Formant Protection (Zero Human False Positives)**: Recalibrated acoustic forensics: natural human vocal tract formant troughs (Wiener entropy < 0.26) strictly protect natural speech from synthetic flags. AI neural vocoders require sustained elevated entropy (>0.34) and mathematical wave locking (>0.85).
            - **Dual Testing Console**: Dedicated "🎙️ Test Live Mic (6s Speech Recognition)" and "🤖 Test AI Voice Radar (6s Forensic Scan)" buttons for clear, isolated testing.
            - **Permanent Cryptographic Keystore**: Built and pre-signed with permanent debug keystore (v1 + v2 schemes) for direct in-place updates.
          files: build-artifacts/XORcall-v1.2.9-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
