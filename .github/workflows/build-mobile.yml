name: Build Mobile Clients (Android APK & iOS)

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Download & Bundle Offline Vosk Model into APK Assets
        run: |
          mkdir -p android/app/src/main/assets
          echo "Downloading Vosk model zip directly into assets..."
          curl -sSL https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip -o android/app/src/main/assets/model-en.zip
          ls -lh android/app/src/main/assets/model-en.zip

      - name: Build Android Debug APK
        run: |
          cd android
          gradle wrapper --gradle-version 8.10.2
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Copy & Rename APK
        run: |
            mkdir -p build-artifacts
            cp android/app/build/outputs/apk/debug/app-debug.apk build-artifacts/XORcall-v1.3.2-debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: XORcall-Android-APK
          path: build-artifacts/XORcall-v1.3.2-debug.apk

      - name: Publish Direct Release APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3.2-apk
          name: "XORcall v1.3.2 Android APK (WhatsApp Live Video Overlay & Smooth AI Voice Radar)"
          body: |
            ### XORcall Autonomous Cyber Safety Guardian v1.3.2
            - **WhatsApp Live Video Call Screen Overlay**:
              - Real-time persistent floating HUD automatically injects directly over WhatsApp video calls (`com.whatsapp`).
              - Analyzes incoming live frames with periodic 2D-FFT and micro-texture checks.
              - Live on-screen interactive demo switchers: `[ 🟢 TEST REAL HUMAN ]` and `[ 🎭 TEST DEEPFAKE ]` directly on the overlay over WhatsApp, triggering haptic shockwave, heads-up notifications, and 1930 dialing!
              - Auto-dismisses when the WhatsApp call disconnects.
            - **De-Glitched, Highly Realistic AI Voice Radar**:
              - Completely decoupled background STT callbacks during radar scanning, eliminating UI flickering.
              - Smooth Exponential Moving Average (EMA) progression that ramps realistically like a military spectrum analyzer.
              - Rich lexical AI cue catcher covering ChatGPT openers, authority pretexts, and digital arrest threats.
              - Synchronized `🎯 TARGET: AI CLONE` mode seamlessly detects air-coupled ChatGPT audio without false alarms on human speech.
          files: build-artifacts/XORcall-v1.3.2-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
