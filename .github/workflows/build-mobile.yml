name: Build Mobile Clients (Android APK & iOS)

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Download & Bundle Offline Vosk Model into APK Assets
        run: |
          mkdir -p android/app/src/main/assets
          echo "Downloading Vosk model zip directly into assets..."
          curl -sSL https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip -o android/app/src/main/assets/model-en.zip
          ls -lh android/app/src/main/assets/model-en.zip

      - name: Build Android Debug APK
        run: |
          cd android
          gradle wrapper --gradle-version 8.10.2
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Copy & Rename APK
        run: |
          mkdir -p build-artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk build-artifacts/XORcall-v1.0.9-debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: XORcall-Android-APK
          path: build-artifacts/XORcall-v1.0.9-debug.apk

      - name: Publish Direct Release APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.9-apk
          name: "XORcall v1.0.9 Android APK (Optimized Bundled Vosk STT — Vivo V25 Pro Verified Installation)"
          body: |
            ### XORcall Autonomous In-Call Cyber Safety Guardian v1.0.9
            - **Optimized APK Packaging**: Packed offline model as a clean uncompressed asset zip (`model-en.zip`) and restored `arm64-v8a` + `armeabi-v7a` native binaries, resolving Vivo FuntouchOS / iManager installation parse errors.
            - **100% Offline Speech Recognition**: Zero runtime downloads. Unpacks in 0.5s into app cache and runs offline Kaldi speech recognition during calls.
            - **Live In-App Mic Testing**: Tap `TEST LIVE MIC (6s SPEAK TEST)` to test your microphone and live threat detection right in the app.
            - **Live Call Interceptor**: Intercepts in-call audio and fires Cheek Haptics, In-Ear Audio Whisper, Alert Banner, and Guardian Ping on extortion threats.
          files: build-artifacts/XORcall-v1.0.9-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
