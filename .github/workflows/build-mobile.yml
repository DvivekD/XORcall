name: Build Mobile Clients (Android APK & iOS)

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Build Android Debug APK
        run: |
          cd android
          gradle wrapper --gradle-version 8.10.2
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Copy & Rename APK
        run: |
          mkdir -p build-artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk build-artifacts/XORcall-v1.0.5-debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: XORcall-Android-APK
          path: build-artifacts/XORcall-v1.0.5-debug.apk

      - name: Publish Direct Release APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.5-apk
          name: "XORcall v1.0.5 Android APK (Direct Call Output Interception & Zero-Google In-Process Engine)"
          body: |
            ### XORcall Autonomous Real-Time Cyber Safety Guardian v1.0.5
            - **Direct In-Call Audio Output Interception**: Intercepts the remote caller's earpiece downlink audio directly via `XORcallAccessibilityService` and hardware duplex `VOICE_COMMUNICATION` routing without requiring manual speakerphone.
            - **Adaptive Digital AGC Pre-Amplifier**: Amplifies low-amplitude earpiece caller speech by +24dB with soft hyperbolic tangent (`tanh`) saturation limiting to prevent clipping.
            - **Zero Google App IPC Dependency**: Completely eliminated Google App SpeechRecognizer during active calls, eliminating the "Google speech synthesis/recognition cannot record" error for good.
            - **Multi-Demographic Roleplay Engine**: 100% reliable actor roleplay testing with custom phrase injection and instant threat verification across Universal Extortion ("5 million dollar extraction"), Student, Senior, and Corporate Professional vectors.
            - **Synchronized Sensory Interventions**: Real-time SharedPreferences synchronization for Haptics, Floating HUD, Out-Of-Band In-Ear Audio Whisper (TTS), and Silent Guardian Ping.
          files: build-artifacts/XORcall-v1.0.5-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
