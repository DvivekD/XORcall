name: Build Mobile Clients (Android APK & iOS)

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Build Android Debug APK
        run: |
          cd android
          gradle wrapper --gradle-version 8.10.2
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Copy & Rename APK
        run: |
          mkdir -p build-artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk build-artifacts/XORcall-v1.0.7-debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: XORcall-Android-APK
          path: build-artifacts/XORcall-v1.0.7-debug.apk

      - name: Publish Direct Release APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.7-apk
          name: "XORcall v1.0.7 Android APK (Vosk On-Device STT — Offline In-Call Live Transcriber & Extortion Interceptor)"
          body: |
            ### XORcall Autonomous In-Call Cyber Safety Guardian v1.0.7
            - **Vosk True On-Device STT Engine**: Replaced Google SpeechRecognizer IPC with a fully offline on-device Vosk engine. Works seamlessly DURING active telephony phone calls without being blocked by Android 14 / Vivo FuntouchOS audio policies.
            - **Direct PCM Audio Line Ingestion**: Directly feeds raw 16kHz PCM from `AudioRecord(VOICE_COMMUNICATION)` into Vosk for live transcription without distortion.
            - **Live Word Streaming**: Streams live partial & final transcribed words directly onto the UI transcript card and triggers alerts in real time.
            - **Instant Sensory Interventions**: Immediately fires Cheek Haptics Shockwave, In-Ear Audio Whisper (TTS), Heads-Up Alert Banner, and Silent Guardian Ping on threat keywords (`kill`, `son`, `5 lakhs`, `kidnap`, etc.).
            - **BSA Section 63 Digital Evidence Vault**: Logs all intercepted calls with SHA-256 cryptographic forensic hashes for instant 1930 / I4C cybercrime filing.
          files: build-artifacts/XORcall-v1.0.7-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
