name: Build Mobile Clients (Android APK & iOS)

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Download & Bundle Offline Vosk Model into APK Assets
        run: |
          mkdir -p android/app/src/main/assets
          echo "Downloading Vosk model zip directly into assets..."
          curl -sSL https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip -o android/app/src/main/assets/model-en.zip
          ls -lh android/app/src/main/assets/model-en.zip

      - name: Build Android Debug APK
        run: |
          cd android
          gradle wrapper --gradle-version 8.10.2
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Copy & Rename APK
        run: |
            mkdir -p build-artifacts
            cp android/app/build/outputs/apk/debug/app-debug.apk build-artifacts/XORcall-v1.3.1-debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: XORcall-Android-APK
          path: build-artifacts/XORcall-v1.3.1-debug.apk

      - name: Publish Direct Release APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3.1-apk
          name: "XORcall v1.3.1 Android APK (Video Deepfake Detection, Contact Whitelisting & Financial App Lockdown)"
          body: |
            ### XORcall Autonomous Cyber Safety Guardian v1.3.1
            - **Real-Time Video Call Deepfake Detection**:
              - Dual-spectrum visual inspection: 2D-FFT azimuthal spectral lattice spikes (GAN/diffusion upscaler artifacts), face boundary warping (Bhattacharyya color divergence), skin micro-texture Laplacian edge variance, and eye blink cadence.
              - Live WhatsApp/Video call HUD overlay with `🟢 VERIFIED BIOMETRIC IDENTITY` badge for genuine webcam feeds vs `🚨 CRITICAL VIDEO DEEPFAKE DETECTED (96%)` with haptic alert.
              - In-app interactive video testing viewport with normal camera feed vs deepfake virtual camera test modes.
            - **Automatic Contact Whitelisting & Kinship Engine**:
              - Automatically whitelists Starred contacts and kinship relationships (Mom, Dad, Son, Daughter, Spouse) directly from Android contacts.
              - Pre-armed with national emergency lines (1930 Cyber Helpline, 112) and verified banking toll-free numbers (SBI, HDFC, ICICI, etc.).
              - Automatically suppresses scam alarms on whitelisted calls and logs them as `TRUSTED_CONTACT` (`RiskLevel.SAFE`).
            - **Automatic Financial App Lockdown**:
              - During an active extortion or Digital Arrest scam (`RiskLevel.CRITICAL`), `isScamCallActive` is armed.
              - If the victim attempts to open PhonePe, GPay, Paytm, BHIM, YONO SBI, crypto wallets, or Telegram, XORcall instantly executes `GLOBAL_ACTION_HOME` and displays an unclosable full-screen `LockdownActivity` with 1-tap 1930 dialing and an emergency bypass slider.
            - **Permanent Cryptographic Keystore**: Built and signed with permanent debug keystore for seamless in-place updates.
          files: build-artifacts/XORcall-v1.3.1-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
