name: Build Mobile Clients (Android APK & iOS)

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Download & Bundle Offline Vosk Model into APK Assets
        run: |
          mkdir -p android/app/src/main/assets
          echo "Downloading Vosk model zip directly into assets..."
          curl -sSL https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip -o android/app/src/main/assets/model-en.zip
          ls -lh android/app/src/main/assets/model-en.zip

      - name: Build Android Debug APK
        run: |
          cd android
          gradle wrapper --gradle-version 8.10.2
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Copy & Rename APK
        run: |
            mkdir -p build-artifacts
            cp android/app/build/outputs/apk/debug/app-debug.apk build-artifacts/XORcall-v1.2.6-debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: XORcall-Android-APK
          path: build-artifacts/XORcall-v1.2.6-debug.apk

      - name: Publish Direct Release APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.6-apk
          name: "XORcall v1.2.6 Android APK (4-Stage Kill-Chain Engine + ChatGPT Voice DSP Forensics)"
          body: |
            ### XORcall Autonomous In-Call Cyber Safety Guardian v1.2.6
            - **4-Stage Psychological Kill-Chain Conjunction Engine**: Eliminated false positives on everyday words like 'daughter', 'hospital', or 'lakhs'. Scam alerts strictly require co-occurrence of Pretext Hook + Fake Authority/Legal Threat + Sensory Isolation + Coercive Payment Demands.
            - **Benign Mitigators**: Legitimate calls (e.g. physical hospital triage without payment demands, official university portals, routine workplace tasks) are actively verified and protected as SAFE.
            - **Conversational AI Voice Forensics (ChatGPT Voice Mode & ElevenLabs)**: Implemented Intonation-Detrended Local Jitter (Relative Average Perturbation - RAP). Macro conversational sentence pitch inflections are detrended to accurately isolate underlying neural vocoder spline rigidity (<0.28% RAP), combined with Wiener entropy and vocoder phase shelves (>6.5 kHz).
            - **Optimized Groq Whisper Turbo VAD**: Sentence-aligned adaptive VAD with 250ms cadence pauses and deterministic temperature (0.0) for zero-clipping vernacular speech decoding.
            - **Permanent Cryptographic Keystore**: Built and pre-signed with permanent debug keystore (v1 + v2 schemes) for seamless in-place updates.
          files: build-artifacts/XORcall-v1.2.6-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
