name: Build Mobile Clients (Android APK & iOS)

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Download & Bundle Offline Vosk Model into APK Assets
        run: |
          mkdir -p android/app/src/main/assets
          echo "Downloading Vosk model zip directly into assets..."
          curl -sSL https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip -o android/app/src/main/assets/model-en.zip
          ls -lh android/app/src/main/assets/model-en.zip

      - name: Build Android Debug APK
        run: |
          cd android
          gradle wrapper --gradle-version 8.10.2
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Copy & Rename APK
        run: |
            mkdir -p build-artifacts
            cp android/app/build/outputs/apk/debug/app-debug.apk build-artifacts/XORcall-v1.3.4-debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: XORcall-Android-APK
          path: build-artifacts/XORcall-v1.3.4-debug.apk

      - name: Publish Direct Release APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3.4-apk
          name: "XORcall v1.3.4 Android APK (Acoustic AI Voice Detection & WhatsApp Biometric HUD Fix)"
          body: |
            ### XORcall Autonomous Cyber Safety Guardian v1.3.4
            - **Resolved WhatsApp Audio Recording Hardware Lock**:
              - Completely eliminated standby `AudioRecord` background capture in `CallMonitorService` that triggered *"WhatsApp cannot record now as XORcall is recording"*.
              - `AudioRecord` is now strictly released when phone calls are idle and during chat standby.
            - **Unified Live Mic Detection & Glitch Elimination**:
              - Replaced dual competing simulations with ONE clean `START LIVE DETECTION (Speech & AI Voice)` mode.
              - Completely removed rapid 80ms while-loop state mutations that caused UI freezes and haptic loops.
              - Transcription text keywords (stress points like "inspector", "cbi", "transfer") no longer trigger false AI synthetic voice warnings.
            - **Enhanced Acoustic AI Voice Detection Algorithm**:
              - Relaxed air-coupled voicing threshold (`maxCorr >= 0.25f`) and lowered RMS gate (`MIN_SPEECH_RMS = 0.0015f`) to reliably catch quiet ChatGPT voices played through remote laptop speakers.
              - Added Formant Dynamic Contrast (`formantDepthDb`) to identify vocoder valley diffusion (<14 dB dynamic range) alongside Wiener entropy and sub-180Hz driver void (<0.14 ratio).
            - **WhatsApp Video Call Biometric HUD**:
              - Automatically displays verified Biometric vs Deepfake identity HUD overlay and high-priority heads-up banner during active WhatsApp video calls.
            - **Phonetic Speech Normalizer for Digital Arrest**:
              - Automatically normalizes "digital artist", "digit artist", and "digit arrest" to "digital arrest" for instantaneous scam extortion mitigation.
          files: build-artifacts/XORcall-v1.3.4-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
