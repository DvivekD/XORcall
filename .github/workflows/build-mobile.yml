name: Build Mobile Clients (Android APK & iOS)

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Download & Bundle Offline Vosk Model into APK Assets
        run: |
          mkdir -p android/app/src/main/assets
          echo "Downloading Vosk model zip directly into assets..."
          curl -sSL https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip -o android/app/src/main/assets/model-en.zip
          ls -lh android/app/src/main/assets/model-en.zip

      - name: Build Android Debug APK
        run: |
          cd android
          gradle wrapper --gradle-version 8.10.2
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Copy & Rename APK
        run: |
            mkdir -p build-artifacts
            cp android/app/build/outputs/apk/debug/app-debug.apk build-artifacts/XORcall-v1.2.8-debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: XORcall-Android-APK
          path: build-artifacts/XORcall-v1.2.8-debug.apk

      - name: Publish Direct Release APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.8-apk
          name: "XORcall v1.2.8 Android APK (Decoupled Multi-Feature Neural Voice Radar for ChatGPT & Indian Accents)"
          body: |
            ### XORcall Autonomous In-Call Cyber Safety Guardian v1.2.8
            - **Decoupled Multi-Feature Neural Voice Detection**: Removed the mathematical bottleneck where syllable intonation glides (pitch shifts across words) penalized the entire detector down to 0.05. Evaluates Wiener entropy (diffusion floor), autocorrelation wave purity (harmonic lock > 0.60), and high-frequency vocoder phase shelf independently.
            - **ChatGPT Voice Mode & Indian Accent Recognition**: Reliably identifies multimodal end-to-end neural audio streams (OpenAI GPT-4o, ElevenLabs, StyleTTS) even during rapid conversational cadence and expressive accent intonations.
            - **Real-Time Forensic Radar**: Displays live Harmonic Purity, High-Frequency Phase Shelf, and Wiener Entropy metrics on the home screen and in floating call banners.
            - **Permanent Cryptographic Keystore**: Built and pre-signed with permanent debug keystore (v1 + v2 schemes) for direct updates over previous versions.
          files: build-artifacts/XORcall-v1.2.8-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
