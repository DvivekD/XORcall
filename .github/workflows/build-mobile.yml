name: Build Mobile Clients (Android APK & iOS)

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Build Android Debug APK
        run: |
          cd android
          gradle wrapper --gradle-version 8.10.2
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Copy & Rename APK
        run: |
          mkdir -p build-artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk build-artifacts/XORcall-v1.0.3-debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: XORcall-Android-APK
          path: build-artifacts/XORcall-v1.0.3-debug.apk

      - name: Publish Direct Release APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.3-apk
          name: "XORcall v1.0.3 Android APK (Multi-Demographic Threat Vectors & AI Voice Detection)"
          body: |
            ### XORcall Autonomous Real-Time Cyber Safety Guardian v1.0.3
            - Multi-Demographic Threat Lexicon: Student (Telegram tasks/fees), Senior (Digital Arrest/FD liquidation), Corporate Professional (FedEx/TRAI/Customs).
            - Neural Acoustic AI Synthetic Voice Clone Detector (8kHz vocoder roll-off & jitter anomaly).
            - Smart Whitelisting: Auto-allows verified bank toll-free lines (1800 SBI, HDFC, ICICI) and emergency numbers (112, 100, 1930).
            - Mandatory monitoring strictly on unknown callers and high-risk international numbers (+92, +880, +234, +855).
            - Forensic Call Vault with 1-click BSA Section 63 compliant 1930 dossier generator and SHA-256 integrity proofs.
            - Vivo V25 Pro / Android 14 full compatibility.
          files: build-artifacts/XORcall-v1.0.3-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
