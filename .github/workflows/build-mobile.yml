name: Build Mobile Clients (Android APK & iOS)

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Build Android Debug APK
        run: |
          cd android
          gradle wrapper --gradle-version 8.10.2
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Copy & Rename APK
        run: |
          mkdir -p build-artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk build-artifacts/XORcall-v1.0.4-debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: XORcall-Android-APK
          path: build-artifacts/XORcall-v1.0.4-debug.apk

      - name: Publish Direct Release APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.4-apk
          name: "XORcall v1.0.4 Android APK (In-Call Audio Record, Universal Extortion & Dual Mode Roleplay)"
          body: |
            ### XORcall Autonomous Real-Time Cyber Safety Guardian v1.0.4
            - **Universal Extortion Interception**: Detects multi-million dollar ransom demands (e.g. "5 million dollar extraction"), kidnap/accident coercion, and immediate wire payment threats.
            - **Multi-Demographic Actor Roleplay**: Full support for physical actor testing across Student (Telegram/fees/sextortion), Senior (Digital Arrest/RBI escrow/FD liquidation), and Professional (FedEx MDMA/TRAI disconnection) vectors.
            - **Hardware AudioRecord In-Call Stream**: Continuously feeds 16kHz PCM audio to the neural vocoder AI voice clone detector and acoustic energy monitor.
            - **Self-Healing Speech Recognizer**: Auto-recovers from Android in-call microphone contention without deadlocking.
            - **Synchronized Guardian Settings**: Real-time SharedPreferences synchronization for Haptics, Floating HUD, Out-Of-Band In-Ear Audio Whisper (TTS), and Silent Guardian Ping.
            - **Vivo V25 Pro / Android 14 Speakerphone Optimization**: Full dual testing support via live speakerphone calls and in-app actor roleplay microphone.
          files: build-artifacts/XORcall-v1.0.4-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
