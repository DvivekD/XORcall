name: Build Mobile Clients (Android APK & iOS)

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Download & Bundle Offline Vosk Model into APK Assets
        run: |
          mkdir -p android/app/src/main/assets
          echo "Downloading Vosk model zip directly into assets..."
          curl -sSL https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip -o android/app/src/main/assets/model-en.zip
          ls -lh android/app/src/main/assets/model-en.zip

      - name: Build Android Debug APK
        run: |
          cd android
          gradle wrapper --gradle-version 8.10.2
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Copy & Rename APK
        run: |
            mkdir -p build-artifacts
            cp android/app/build/outputs/apk/debug/app-debug.apk build-artifacts/XORcall-v1.2.3-debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: XORcall-Android-APK
          path: build-artifacts/XORcall-v1.2.3-debug.apk

      - name: Publish Direct Release APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.3-apk
          name: "XORcall v1.2.3 Android APK (Adaptive Soft-Knee AGC + Groq Prompt Biasing + Phonetic Extortion Radar)"
          body: |
            ### XORcall Autonomous In-Call Cyber Safety Guardian v1.2.3
            - **Adaptive Soft-Knee Digital AGC (No Clipping Distortion)**: Eliminated harsh `7.5x tanh` saturation on max-volume speakerphone audio. Replaced with dynamic peak-tracking automatic gain control that maintains pristine, distortion-free speech formants for Vosk and Whisper.
            - **Groq Whisper Turbo Domain Prompt Biasing**: Injected cyber extortion, Digital Arrest, police custody, and Indian currency prompt biasing into Whisper Turbo multipart requests, drastically increasing recognition probability on accents and loud in-call audio.
            - **Comprehensive Phonetic Extortion Normalizer**: Added coverage for split words, acoustic distortions, and misrecognitions ("police custom" -> "police custody", "digital address" -> "digital arrest", "five lock/lacks/block" -> "5 lakh", "egg stortion" -> "extortion", "why are transfer" -> "wire transfer").
            - **One-Tap Quick Paste Groq API Key**: Added one-tap "📋 Paste Key" in the Cloud STT configuration dialog with direct guidance on free instant key generation at `console.groq.com`.
            - **Permanent Cryptographic Keystore (v1 + v2 Schemes)**: Pre-signed with committed debug keystore for seamless in-place updates.
          files: build-artifacts/XORcall-v1.2.3-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
